<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="BalanceHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b35">
        <animate attributeName="stop-color" values="#ff6b35;#ffd23f;#34d399;#22d3ee;#2563eb;#8b5cf6;#ec4899;#ff6b35" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#2563eb;#8b5cf6;#ec4899;#ff6b35;#ffd23f;#34d399;#22d3ee" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#ff6b35;#ffd23f;#34d399;#22d3ee;#2563eb;#8b5cf6" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="cx" values="0.2;0.85;0.2" dur="10s" repeatCount="indefinite"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="orbitA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="0.4" stop-color="#ffd23f"/>
      <stop offset="0.7" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="orbitB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="340"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="#0a0f1e" opacity="0.22"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <rect x="-260" y="-60" width="180" height="460" fill="#ffffff" opacity="0.10" transform="skewX(-18)">
      <animate attributeName="x" values="-360;1500" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <!-- 图标:黑色圆角方块 + 彩虹原子(矢量仿制,自带在 SVG 内,可在 GitHub 渲染) -->
    <g transform="translate(150,170)">
      <rect x="-48" y="-48" width="96" height="96" rx="24" fill="#0b0f14"/>
      <rect x="-48" y="-48" width="96" height="96" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <g fill="none" stroke-width="4.5">
        <ellipse cx="0" cy="0" rx="34" ry="13" stroke="url(#orbitA)"/>
        <ellipse cx="0" cy="0" rx="34" ry="13" stroke="url(#orbitB)" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="34" ry="13" stroke="url(#orbitB)" transform="rotate(120)"/>
      </g>
      <circle cx="0" cy="0" r="6.5" fill="#0b0f14" stroke="#ffffff" stroke-width="3"/>
    </g>

    <text x="238" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1">BalanceHub</text>
    <text x="240" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#F2F5FF">别再在多个中转站后台之间来回切 —— 余额 · 签到 · 用量 · 测活,一屏管好</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#E2E8FF">
      <text x="240" y="270">macOS</text><text x="330" y="270" fill-opacity="0.6">·</text>
      <text x="352" y="270">Windows</text><text x="470" y="270" fill-opacity="0.6">·</text>
      <text x="492" y="270">Linux</text><text x="600" y="270" fill-opacity="0.6">·</text>
      <text x="622" y="270">Tauri 2 · 本地优先</text>
    </g>
  </g>
</svg>
