[package]
name = "balancehub-core"
version = "0.6.9"
description = "BalanceHub 网络协议、数据模型与调度核心；不依赖桌面窗口。"
authors = ["NotoChen <46807914+NotoChen@users.noreply.github.com>"]
edition = "2021"
repository = "https://github.com/NotoChen/BalanceHub"
license-file = "../../LICENSE"

[dependencies]
tempfile = "3"
dunce = "1.0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "system-proxy", "socks"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
futures-util = "0.3"
lru = "0.16.3"
getrandom = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_System_IO"] }
