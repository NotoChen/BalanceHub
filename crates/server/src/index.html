<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BalanceHub 服务端</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f4;
        --panel: #ffffff;
        --line: #d9d9d2;
        --text: #24241f;
        --muted: #6d6d64;
        --accent: #2f6b4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171714;
          --panel: #20201c;
          --line: #34342e;
          --text: #ececE4;
          --muted: #9b9b90;
          --accent: #6fbf95;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.hint {
        color: var(--muted);
        margin: 0 0 24px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        padding: 2px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 12px;
      }
      .muted {
        color: var(--muted);
      }
      #message {
        min-height: 20px;
        color: var(--muted);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BalanceHub 服务端</h1>
      <p class="hint">
        这是无界面后端的调试页面：中转站配置、额度刷新与桌面版共用同一套核心。
      </p>

      <section>
        <h2>中转站</h2>
        <table>
          <thead>
            <tr>
              <th>名称</th>
              <th>地址</th>
              <th>协议</th>
              <th>状态</th>
              <th>额度</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="providers">
            <tr>
              <td colspan="6" class="muted">正在读取…</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section>
        <h2>新增中转站</h2>
        <div class="grid">
          <label>名称<input id="name" placeholder="例如：主力站点" /></label>
          <label>地址<input id="baseUrl" placeholder="https://example.com" /></label>
          <label
            >协议
            <select id="protocol">
              <option value="newApi">NewAPI</option>
              <option value="sub2Api">Sub2API</option>
              <option value="api">通用 API Key</option>
            </select>
          </label>
        </div>
        <div class="grid" style="margin-top: 10px">
          <label>用户名<input id="username" autocomplete="off" /></label>
          <label>密码<input id="password" type="password" autocomplete="off" /></label>
          <label>API Key<input id="apiKey" type="password" autocomplete="off" /></label>
        </div>
        <div class="row">
          <button id="save">保存</button>
          <span class="muted">NewAPI / Sub2API 用账号密码，通用 API Key 只填 Key。</span>
        </div>
        <div id="message"></div>
      </section>
    </main>
    <script>
      const state = { providers: [] };
      const message = (text) => (document.getElementById("message").textContent = text);

      async function api(path, options) {
        const response = await fetch(path, {
          headers: { "content-type": "application/json" },
          ...options,
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.error || body.conflict?.existingProviderName || "请求失败");
        }
        return body;
      }

      function quotaText(provider) {
        const quota = provider.quota;
        if (!quota || !quota.known) return "未读取";
        if (quota.unlimited) return "不限量";
        return `剩余 ${quota.available} · 已用 ${quota.used}`;
      }

      function render() {
        const body = document.getElementById("providers");
        if (!state.providers.length) {
          body.innerHTML =
            '<tr><td colspan="6" class="muted">还没有中转站，先在下面添加一个。</td></tr>';
          return;
        }
        body.innerHTML = "";
        for (const provider of state.providers) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${escape(provider.displayLabel || provider.identity.name)}</td>
            <td class="muted">${escape(provider.identity.baseUrl)}</td>
            <td>${escape(provider.protocolLabel)}</td>
            <td>${escape(provider.runtime.status)}</td>
            <td>${escape(quotaText(provider))}</td>
            <td><button data-id="${escape(provider.identity.id)}">刷新</button></td>`;
          row.querySelector("button").addEventListener("click", () => refresh(provider.identity.id));
          body.append(row);
        }
      }

      function escape(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      }

      async function load() {
        try {
          const body = await api("/api/providers");
          state.providers = body.providers;
          render();
        } catch (error) {
          message(error.message);
        }
      }

      async function refresh(id) {
        message("正在刷新…");
        try {
          await api(`/api/providers/${encodeURIComponent(id)}/refresh`, { method: "POST" });
          message("刷新完成");
          await load();
        } catch (error) {
          message(error.message);
        }
      }

      document.getElementById("save").addEventListener("click", async () => {
        const protocol = document.getElementById("protocol").value;
        const auth = { mode: protocol === "api" ? "apiKey" : "password" };
        if (protocol === "api") {
          auth.apiKey = document.getElementById("apiKey").value.trim();
        } else {
          auth.loginUsername = document.getElementById("username").value.trim();
          auth.loginPassword = document.getElementById("password").value;
        }
        const input = {
          identity: {
            name: document.getElementById("name").value.trim(),
            baseUrl: document.getElementById("baseUrl").value.trim(),
            protocol,
          },
          auth,
        };
        message("正在保存…");
        try {
          await api("/api/providers", { method: "POST", body: JSON.stringify(input) });
          message("已保存");
          await load();
        } catch (error) {
          message(error.message);
        }
      });

      load();
    </script>
  </body>
</html>
