[package]
name = "balancehub"
version = "0.6.2"
description = "用于集中管理 AI 中转站账号的跨平台桌面应用。"
authors = ["NotoChen <46807914+NotoChen@users.noreply.github.com>"]
edition = "2021"
repository = "https://github.com/NotoChen/BalanceHub"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "balancehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Native CLI binaries can exceed 200 MiB. Keep bounded executable hashing
# within its deadline in dev/test as well as release builds.
[profile.dev.package.sha2]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 浏览器启动验证使用自动清理的独立临时 profile。
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "system-proxy", "socks"] }
# updater 目前使用 reqwest 0.13；显式合并 SOCKS 与系统代理 feature，
# 并由 tauri-plugin-updater 的 native-tls feature 使用系统证书存储。
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["socks", "system-proxy"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
toml = "0.8"
toml_edit = "0.20"
getrandom = "0.3"
semver = "1"
regex = "1"
regex-lite = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
futures-util = "0.3"
lru = "0.16.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs"] }

[target.'cfg(unix)'.dependencies]
# Unix 进程组操作与配置文件的当前用户写入权限查询。
libc = "0.2"
# 目录资产盘点使用句柄相对的逐级 openat 与 RAII 目录枚举，避免路径替换竞态。
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# 目录资产盘点必须从已打开且禁止删除共享的句柄枚举，避免路径替换竞态。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry"] }
